<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nordisk Have & Anlæg</title>
<style>
body{margin:0;font-family:Arial;background:#f4f4f4}
header{background:#155b28;color:#fff;text-align:center;padding:40px 20px}
header img{width:170px;border-radius:50%;background:#0d2d18;box-shadow:0 10px 25px rgba(0,0,0,.3)}
main{max-width:900px;margin:20px auto;background:#fff;border-radius:20px;padding:25px;box-shadow:0 6px 20px rgba(0,0,0,.15)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px}
.card{background:#f7fbf7;border:1px solid #ddd;border-radius:12px;padding:18px;font-weight:bold}
.btn{display:inline-block;margin-top:20px;background:#155b28;color:#fff;padding:14px 22px;border-radius:10px;text-decoration:none}
</style>
</head>
<body>
<header>
<img src="logo.png" alt="Logo">
<h1>Nordisk Have & Anlæg</h1>
<p>Driftssystem</p>
</header>
<main>
<h2>Velkommen</h2>
<p>Systemet er online.</p>
<div class="grid">
<div class="card">👥 Kunder</div>
<div class="card">📋 Tilbud</div>
<div class="card">🚚 Ordrestyring</div>
<div class="card">💰 Prisberegner</div>
<div class="card">📅 Kalender</div>
<div class="card">🧾 Faktura</div>
<div class="card">📷 Dokumentation</div>
<div class="card">👷 Medarbejdere</div>
</div>
<a class="btn" href="#">Kom i gang</a>
</main>
</body>
</html>
