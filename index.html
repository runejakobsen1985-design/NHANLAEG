<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nordisk Have & Anlæg</title>
  <style>
    :root{
      --green:#0b2f1d;
      --green2:#176b32;
      --cream:#f8f1dc;
      --bg:#f4f4ef;
      --text:#101510;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    header{
      background:linear-gradient(160deg,var(--green),var(--green2));
      color:white;
      text-align:center;
      padding:42px 20px 48px;
    }
    .logo{
      width:180px;
      height:180px;
      object-fit:contain;
      border-radius:999px;
      margin-bottom:18px;
      box-shadow:0 12px 30px rgba(0,0,0,.35);
      background:#07170f;
    }
    h1{
      font-size:42px;
      line-height:1.05;
      margin:10px 0;
    }
    .subtitle{
      font-size:20px;
      opacity:.95;
      margin:0;
    }
    main{
      max-width:960px;
      margin:-28px auto 40px;
      padding:0 16px;
    }
    .card{
      background:white;
      border-radius:22px;
      padding:28px;
      box-shadow:0 10px 28px rgba(0,0,0,.12);
      margin-bottom:18px;
    }
    .grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:14px;
    }
    .module{
      border:1px solid #e4e4dc;
      border-radius:16px;
      padding:18px;
      background:#fffdf7;
      font-weight:700;
    }
    .button{
      display:inline-block;
      margin-top:18px;
      padding:15px 24px;
      background:var(--green2);
      color:white;
      text-decoration:none;
      border-radius:14px;
      font-weight:700;
    }
    footer{
      text-align:center;
      padding:24px;
      color:#566056;
      font-size:14px;
    }
    @media(max-width:650px){
      .logo{width:145px;height:145px}
      h1{font-size:34px}
      .grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <header>
    <img src="assets/logo.png" alt="Nordisk Have & Anlæg logo" class="logo" />
    <h1>Nordisk Have & Anlæg</h1>
    <p class="subtitle">Driftssystem og ejendomsservice</p>
  </header>

  <main>
    <section class="card">
      <h2>Velkommen</h2>
      <p>Systemet er online. Næste fase er at bygge de rigtige moduler ind i driftssystemet.</p>
      <a class="button" href="#moduler">Kom i gang</a>
    </section>

    <section class="card" id="moduler">
      <h2>Moduler</h2>
      <div class="grid">
        <div class="module">👥 Kunder</div>
        <div class="module">📋 Tilbud</div>
        <div class="module">🚚 Ordrestyring</div>
        <div class="module">💰 Prisberegner</div>
        <div class="module">📅 Kalender</div>
        <div class="module">🧾 Faktura</div>
        <div class="module">👷 Medarbejdere</div>
        <div class="module">📷 Dokumentation</div>
      </div>
    </section>
  </main>

  <footer>
    © Nordisk Have & Anlæg
  </footer>
</body>
</html>
